[package]
name = "perforce-cli"
version = "0.1.0-alpha.2"
edition = "2024"
authors = [
  "araraloren <blackcatoverwall@gmail.com>",
]
license = "MPL-2.0"
description = "A type-safe builder library for spawning Perforce (p4) commands, with compile-time option state isolation and multi-version support."
readme = "README.md"
repository = "https://github.com/araraloren/perforce-cli"
documentation = "https://docs.rs/perforce-cli"
keywords = [
  "perforce",
  "p4",
  "cli",
  "version-control",
  "builder",
]
categories = [
  "command-line-interface",
  "development-tools",
]

[dependencies]

[features]

default = ["v2026_1"]

